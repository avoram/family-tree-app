<mat-toolbar color="primary">
  <span>Family Tree</span>
</mat-toolbar>

<main class="main-content">
  <mat-card class="controls-card">
    <mat-card-content>
      <app-tree-selection (treeSelected)="onTreeSelected($event)" />
    </mat-card-content>
  </mat-card>

  @if (selectedTree(); as tree) {
    <div class="content-grid" [class.has-detail]="selectedMemberId()">
      <section class="tree-area" aria-label="Family tree visualization">
        <app-tree-visualization [tree]="tree" (memberSelected)="onMemberSelected($event)" />
      </section>

      @if (selectedMemberId(); as memberId) {
        <aside class="detail-area" aria-label="Member details">
          <app-member-detail
            [treeId]="tree.id"
            [memberId]="memberId"
            (closed)="onMemberDetailClosed()"
          />
        </aside>
      }
    </div>
  } @else {
    <section class="tree-area tree-area--empty" aria-label="Family tree visualization">
      <p class="placeholder-text">Tree visualization will appear here.</p>
    </section>
  }
</main>
